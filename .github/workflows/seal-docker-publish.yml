name: Seal - Build and Publish Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: aldoshkineg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [seal-api, seal-worker, seal-ui]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load ENV_FILE secret
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_FILE" > .env
          # Make every var from the secret visible in this step's shell.
          set -a; source ./.env; set +a
          if grep -q '^COSIGN_PRIVATE_KEY_B64=' ./.env; then
            echo "OK: COSIGN_PRIVATE_KEY_B64 present in ENV_FILE secret"
          else
            echo "MISSING: COSIGN_PRIVATE_KEY_B64 not in ENV_FILE secret" >&2
            exit 1
          fi
          # Materialise the cosign private key (base64 in .env) for the sign step.
          # Use a heredoc so the multiline PEM is preserved verbatim in $GITHUB_ENV.
          COSIGN_KEY="$(echo "$COSIGN_PRIVATE_KEY_B64" | base64 -d)"
          echo "::add-mask::$COSIGN_KEY"
          {
            echo "COSIGN_PRIVATE_KEY<<EOF"
            echo "$COSIGN_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dev tag
        id: dev-tag
        if: github.event_name == 'workflow_dispatch'
        run: echo "tag=dev-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.ORG }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.dev-tag.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/seal/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ env.COSIGN_PRIVATE_KEY }}
        run: |
          for img in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "Signing ${img}"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${img}"
          done
