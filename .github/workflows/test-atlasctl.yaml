name: atlasctl Tests

on:
  push:
    paths:
      - "tools/atlasctl/**"
  pull_request:
    paths:
      - "tools/atlasctl/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlasctl-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Ensure prerequisites (curl, unzip)
        run: |
          if command -v curl >/dev/null 2>&1 && command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y curl unzip
          else
            apt-get update -y && apt-get install -y curl unzip
          fi

      - name: Install go-task
        run: bash tools/ci/install-tools.sh go-task

      - name: Run unit tests
        run: task -d tools/atlasctl test
