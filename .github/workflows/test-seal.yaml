name: Seal Tests

on:
  push:
    paths:
      - "apps/seal/**"
  pull_request:
    paths:
      - "apps/seal/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install go-task
        run: bash tools/ci/install-tools.sh go-task

      - name: Run unit tests
        run: task -d apps/seal test
