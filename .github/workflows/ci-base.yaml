name: CI Base

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ENV_FILE:
        required: true

# Part of the self-hosted (mutating) pipeline — serialized via the shared
# `atlas-stage` concurrency group so two base runs never touch the cluster at once.
concurrency:
  group: atlas-stage
  cancel-in-progress: false

# Least-privilege: no token by default; only the steps that check out code
# request `contents: read`. The repo secret (ENV_FILE) is passed separately.
permissions: {}

# Canonical "base" stage: tools + terraform (incus) apply + vault seeds.
# Reused by ci-all.yaml via `uses:`.
#
# All secrets arrive as a single ENV_FILE (the repo's .env). The first step
# replays it: writes .env, exports every var to $GITHUB_ENV, and materialises
# the root CA cert/key (base64 in .env) into security/certs/ for the steps below.

jobs:
  base:
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/cluster-env

      - uses: ./.github/actions/load-env
        with:
          env_file: ${{ secrets.ENV_FILE }}
          materialise_ca: "true"

      - uses: ./.github/actions/tools
        with:
          tools: "terraform vault kubectl incus xorriso"

      - uses: ./.github/actions/terraform

      - uses: ./.github/actions/seed-vault

      - name: Cleanup secrets from workspace
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f security/certs/ca.crt security/certs/ca.key
          echo "Removed workspace secrets (.env, ca.crt, ca.key)"
