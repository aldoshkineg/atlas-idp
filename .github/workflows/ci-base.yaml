name: CI Base

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ENV_FILE:
        required: true

# Part of the self-hosted (mutating) pipeline — serialized via the shared
# `atlas-stage` concurrency group so two base runs never touch the cluster at once.
concurrency:
  group: atlas-stage
  cancel-in-progress: false

# Least-privilege: no token by default; only the steps that check out code
# request `contents: read`. The repo secret (ENV_FILE) is passed separately.
permissions: {}

# Canonical "base" stage: tools + terraform (incus) apply + vault seeds.
# Reused by ci-all.yaml via `uses:`.
#
# All secrets arrive as a single ENV_FILE (the repo's .env). The first step
# replays it: writes .env, exports every var to $GITHUB_ENV, and materialises
# the root CA cert/key (base64 in .env) into security/certs/ for the steps below.

jobs:
  base:
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 45

    env:
      KUBECONFIG: /var/tmp/atlas/talos/kubeconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load ENV_FILE secret
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          # Persist the whole .env into the repo so local scripts
          # (seed-vault.sh) and composite actions behave like a dev machine.
          printf '%s\n' "$ENV_FILE" > .env

          # Export every var to $GITHUB_ENV so later steps see them as env vars,
          # and into the current shell so the cert materialisation below can use
          # them ($GITHUB_ENV only propagates to *subsequent* steps).
          # Skip GITHUB_TOKEN (provided automatically by Actions; avoid shadowing
          # it), ENV_FILE itself (multiline; not needed as a plain env var), and
          # VAULT_TOKEN (re-derived by seed-vault from the cluster). `::add-mask::`
          # registers each value for log redaction.
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              GITHUB_TOKEN|ENV_FILE|VAULT_TOKEN) continue ;;
            esac
            echo "::add-mask::$value"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            export "$key=$value"
          done < .env

          # Materialise the CA cert + key (base64 in .env) into the expected files.
          mkdir -p security/certs
          echo "${ATLAS_CA_CRT_B64:-}" | base64 -d > security/certs/ca.crt
          echo "${ATLAS_CA_KEY_B64:-}" | base64 -d > security/certs/ca.key

      - uses: ./.github/actions/tools
        with:
          tools: "terraform vault kubectl incus xorriso"

      - uses: ./.github/actions/terraform

      - uses: ./.github/actions/seed-vault

      - name: Cleanup secrets from workspace
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f security/certs/ca.crt security/certs/ca.key
          echo "Removed workspace secrets (.env, ca.crt, ca.key)"
