name: CI All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_base:
        description: "Provision base (infra + vault seeds)"
        type: boolean
        default: true
      run_middleware:
        description: "Sync platform layers (DB/MinIO/Vault/monitoring)"
        type: boolean
        default: true
      run_workloads:
        description: "Seed + sync workloads (seal)"
        type: boolean
        default: true

# Serialize every self-hosted (mutating) run against the single shared stage
# cluster via the `atlas-stage` concurrency group declared in each called
# workflow. A new run waits for the in-progress one; it is never cancelled
# mid-apply. The standalone `security` scan and the cloud build workflows
# (seal, atlasctl) run independently.
#
# Triggers:
#   - push to main         -> full pipeline: lint -> base -> middleware -> workloads
#   - pull_request to main -> lint only (validation, NO cluster mutation)
#   - workflow_dispatch    -> full pipeline; phases controlled by the run_base /
#                             run_middleware / run_workloads toggles (all default true)
#
# No commit-message parsing: behaviour is driven solely by the event type and
# the dispatch toggles above.

jobs:
  lint:
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/tools
        with:
          tools: "terraform yamllint"

      - uses: ./.github/actions/lint

  base:
    needs: [lint]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_base)
    uses: ./.github/workflows/ci-base.yaml
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}

  middleware:
    needs: [base]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_middleware) &&
      (needs.base.result == 'success' || needs.base.result == 'skipped')
    uses: ./.github/workflows/ci-middleware.yaml

  workloads:
    needs: [middleware]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_workloads) &&
      (needs.middleware.result == 'success' || needs.middleware.result == 'skipped')
    uses: ./.github/workflows/ci-workload.yaml
