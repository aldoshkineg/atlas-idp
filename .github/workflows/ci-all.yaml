name: CI All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_base:
        description: "Provision base (infra + vault seeds)"
        type: boolean
        default: true
      run_middleware:
        description: "Sync platform layers (DB/MinIO/Vault/monitoring)"
        type: boolean
        default: true
      run_workloads:
        description: "Seed + sync workloads (seal)"
        type: boolean
        default: true

# Serialize every self-hosted (mutating) run against the single shared stage
# cluster via the `atlas-stage` concurrency group declared in each called
# workflow. A new run waits for the in-progress one; it is never cancelled
# mid-apply. The standalone `security` scan and the cloud build workflows
# (seal, atlasctl) run independently.
#
# Triggers:
#   - push to main         -> full pipeline by default; a commit containing
#                             [base] / [middleware] / [workloads] runs ONLY
#                             those layer(s) (positive phase selector)
#   - pull_request to main -> lint only (validation, NO cluster mutation)
#   - workflow_dispatch    -> phases controlled by the run_base / run_middleware
#                             / run_workloads toggles (all default true)

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sel_base: ${{ steps.eval.outputs.sel_base }}
      sel_middleware: ${{ steps.eval.outputs.sel_middleware }}
      sel_workloads: ${{ steps.eval.outputs.sel_workloads }}
    steps:
      - id: eval
        shell: bash
        env:
          MSG: "${{ github.event.head_commit.message }}"
        run: |
          # Positive phase selector from the commit message. If the commit
          # contains [base] / [middleware] / [workloads], ONLY those layers
          # run on push to main (e.g. "[middleware] resync platform layers").
          # If none are present, the full pipeline runs (all selected).
          text="${MSG:-}"
          has_base="false"; has_middleware="false"; has_workloads="false"
          echo "$text" | grep -qiE '\[base\]' && has_base="true"
          echo "$text" | grep -qiE '\[middleware\]' && has_middleware="true"
          echo "$text" | grep -qiE '\[workloads?\]' && has_workloads="true"
          if [ "$has_base" = "true" ] || [ "$has_middleware" = "true" ] || [ "$has_workloads" = "true" ]; then
            sel_base="$has_base"; sel_middleware="$has_middleware"; sel_workloads="$has_workloads"
          else
            sel_base="true"; sel_middleware="true"; sel_workloads="true"
          fi
          echo "sel_base=$sel_base" >> "$GITHUB_OUTPUT"
          echo "sel_middleware=$sel_middleware" >> "$GITHUB_OUTPUT"
          echo "sel_workloads=$sel_workloads" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/tools
        with:
          tools: "terraform yamllint"

      - uses: ./.github/actions/lint

  base:
    needs: [gate, lint]
    if: >-
      github.event_name != 'pull_request' && (
        (github.event_name == 'workflow_dispatch' && inputs.run_base) ||
        (github.event_name != 'workflow_dispatch' && needs.gate.outputs.sel_base == 'true')
      )
    uses: ./.github/workflows/ci-base.yaml
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}

  middleware:
    needs: [gate, base]
    if: >-
      github.event_name != 'pull_request' && (
        (github.event_name == 'workflow_dispatch' && inputs.run_middleware) ||
        (github.event_name != 'workflow_dispatch' && needs.gate.outputs.sel_middleware == 'true')
      ) && (needs.base.result == 'success' || needs.base.result == 'skipped')
    uses: ./.github/workflows/ci-middleware.yaml

  workloads:
    needs: [gate, middleware]
    if: >-
      github.event_name != 'pull_request' && (
        (github.event_name == 'workflow_dispatch' && inputs.run_workloads) ||
        (github.event_name != 'workflow_dispatch' && needs.gate.outputs.sel_workloads == 'true')
      ) && (needs.middleware.result == 'success' || needs.middleware.result == 'skipped')
    uses: ./.github/workflows/ci-workload.yaml
