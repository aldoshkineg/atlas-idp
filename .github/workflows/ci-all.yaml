name: CI All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_base:
        description: "Provision base (infra + vault seeds)"
        type: boolean
        default: true
      run_middleware:
        description: "Sync platform layers (DB/MinIO/Vault/monitoring)"
        type: boolean
        default: true
      run_workloads:
        description: "Seed + sync workloads (seal)"
        type: boolean
        default: true

# Serialize every self-hosted (mutating + checks) run against the single shared
# stage cluster. A new run waits for the in-progress one to finish; it is never
# cancelled mid-apply (cancel-in-progress: false). The standalone `security` scan
# and the cloud build workflows (seal, atlasctl) run independently.
# Default orchestrator: on push/PR runs lint -> base -> middleware -> workloads.
# `lint` runs on the self-hosted runner (reusing its cached toolchain, so no
# binary/provider downloads) and gates `base`: if fmt/validate/yamllint fail,
# there is no point running `terraform apply`.
#
# Disable entirely: include `[skip-ci]` in the commit message / PR title.
# Run only the base phase: include `[base-only]`.
# Manual runs (workflow_dispatch) honour the toggles above instead of markers.

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.eval.outputs.skip }}
      base_only: ${{ steps.eval.outputs.base_only }}
    steps:
      - id: eval
        shell: bash
        env:
          MSG: "${{ github.event.head_commit.message }}"
          PRTITLE: "${{ github.event.pull_request.title }}"
        run: |
          text="${MSG:-$PRTITLE}"
          skip="false"; base_only="false"
          if echo "$text" | grep -qiE '\[skip[-_ ]?ci\]'; then skip="true"; fi
          if echo "$text" | grep -qiE '\[base[-_ ]?only\]'; then base_only="true"; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "base_only=$base_only" >> "$GITHUB_OUTPUT"

  lint:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/tools
        with:
          tools: "terraform yamllint"

      - uses: ./.github/actions/lint

  base:
    needs: [gate, lint]
    if: >-
      needs.gate.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_base)
    uses: ./.github/workflows/ci-base.yaml
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}

  middleware:
    needs: [gate, base]
    if: >-
      needs.gate.outputs.skip != 'true' &&
      needs.gate.outputs.base_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_middleware) &&
      (needs.base.result == 'success' || needs.base.result == 'skipped')
    uses: ./.github/workflows/ci-middleware.yaml

  workloads:
    needs: [gate, middleware]
    if: >-
      needs.gate.outputs.skip != 'true' &&
      needs.gate.outputs.base_only != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_workloads) &&
      (needs.middleware.result == 'success' || needs.middleware.result == 'skipped')
    uses: ./.github/workflows/ci-workload.yaml
