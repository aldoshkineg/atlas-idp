name: CI Middleware

on:
  workflow_dispatch:
  workflow_call:

# Self-hosted (mutating) pipeline — serialized via `atlas-stage`.
concurrency:
  group: atlas-stage
  cancel-in-progress: false

permissions: {}

# Syncs the platform (middleware) layers: storage/security/delivery/observability
# — brings up PostgreSQL / MinIO /  monitoring and lets them stabilize.
# Requires the base stage (CI Base) to be up first so the seeded ExternalSecrets
# find their Vault secrets already provisioned.

jobs:
  middleware:
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/cluster-env

      - uses: ./.github/actions/tools
        with:
          tools: "argocd kubectl jq"

      - name: Sync platform layers (middleware)
        shell: bash
        run: bash ./tools/ci/sync-layers.sh middleware
