name: CI Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
  workflow_call:
    inputs:
      confirm:
        type: string
        required: true

# Self-hosted (mutating) pipeline — serialized via `atlas-stage` so a destroy
# never overlaps an apply (or another destroy) on the shared cluster.
concurrency:
  group: atlas-stage
  cancel-in-progress: false

permissions: {}

jobs:
  destroy:
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: [self-hosted]
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/cluster-env

      - uses: ./.github/actions/tools
        with:
          tools: "terraform"

      - name: Terraform Init
        shell: bash
        working-directory: ./infra/environments/stage
        run: bash "${{ github.workspace }}/tools/ci/terraform-init.sh" "${{ github.workspace }}/infra/environments/stage"

      - name: Terraform Destroy
        shell: bash
        working-directory: ./infra/environments/stage
        run: terraform destroy -auto-approve -lock-timeout=5m
