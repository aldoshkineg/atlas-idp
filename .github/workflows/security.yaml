name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cloud scan of the WHOLE repository on every commit/PR: dependency CVEs
# (seal/atlasctl Go modules, frontend locks), leaked secrets in scripts and
# workflows, and IaC misconfig. Runs independently of ci-all (own concurrency
# group, cancels superseded runs) so it never blocks provisioning.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trivy-iac:
    name: Trivy Repo Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Single source of truth for the trivy version is VERSION_MAP in
      # tools/ci/install-tools.sh — resolve it instead of hardcoding here.
      - name: Resolve Trivy version
        id: trivy
        shell: bash
        run: |
          echo "version=$(bash tools/ci/install-tools.sh --version trivy)" >> "$GITHUB_OUTPUT"

      # Cache both the trivy binary and its vulnerability DB so the cloud scan
      # does not re-download ~50 MB on every commit. The binary is installed
      # into a writable dir (not /usr/local/bin) and added to PATH.
      - name: Cache Trivy binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-bin
          key: trivy-binary-${{ steps.trivy.outputs.version }}

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db
          restore-keys: trivy-db

      # Install via the single source of truth (tools/ci/install-tools.sh) into
      # the cached dir. The conditional `command -v` inside the script skips the
      # download on a cache hit; the binary is added to PATH for the scan step.
      - name: Install Trivy (cached)
        shell: bash
        env:
          BIN_DIR: ${{ runner.temp }}/trivy-bin
        run: |
          mkdir -p "$BIN_DIR"
          export PATH="$BIN_DIR:$PATH"
          bash tools/ci/install-tools.sh trivy
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - uses: ./.github/actions/scan
