name: Terraform Apply (Incus/Talos)
description: "Provision Talos cluster via Terraform + Incus"

runs:
  using: composite
  steps:
    - name: Terraform Init
      shell: bash
      working-directory: ./infra/environments/stage
      run: bash tools/ci/terraform-init.sh .

    - name: Terraform Plan
      shell: bash
      working-directory: ./infra/environments/stage
      env:
        TF_PLUGIN_CACHE_DIR: /opt/terraform/plugin-cache
      run: terraform plan -lock-timeout=5m -refresh=false -out=tfplan

    - name: Terraform Apply
      shell: bash
      working-directory: ./infra/environments/stage
      env:
        TF_PLUGIN_CACHE_DIR: /opt/terraform/plugin-cache
      run: terraform apply -auto-approve tfplan

    - name: Check cluster
      shell: bash
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Wait nodes
      shell: bash
      run: |
        kubectl wait --for=condition=Ready node --all --timeout=300s

    - name: Create CA Secret for cert-manager
      shell: bash
      run: |
        kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret tls atlas-ca-secret \
          --cert=security/certs/ca.crt \
          --key=security/certs/ca.key \
          -n cert-manager \
          --dry-run=client -o yaml | kubectl apply -f -
