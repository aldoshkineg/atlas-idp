name: Vault Seeds
description: "Seed platform secrets into Vault"

# VL_* come from ENV_FILE, which the ci-base "Load ENV_FILE" step exports into
# $GITHUB_ENV before this action runs. seed-vault.sh also sources .env
# directly, so both paths resolve the same vars.

runs:
  using: composite
  steps:
    - name: Seed platform secrets to Vault
      shell: bash
      env:
        VAULT_WAIT_TOTAL_TIMEOUT: 1200
      run: |
        unset VAULT_ADDR
        PF_PID=""

        cleanup() {
          [ -n "$PF_PID" ] && kill "$PF_PID" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        echo "===> Waiting for Vault availability..."
        ./tools/vault/wait-vault.sh

        export VAULT_ADDR="http://127.0.0.1:8200"
        export VAULT_TOKEN="$(kubectl -n vault get secret vault-unseal-keys -o jsonpath='{.data.vault-root}' | base64 -d)"

        echo "===> Port-forwarding Vault ($VAULT_ADDR)..."
        kubectl -n vault port-forward svc/vault 8200:8200 >/tmp/atlas-idp-vault-port-forward.log 2>&1 &
        PF_PID="$!"

        for _ in $(seq 1 10); do
          if vault status >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        echo "===> Seeding platform secrets..."
        ./tools/vault/seed-vault.sh
