name: Install Tools
description: "Install required CLI tools (subset-selectable via the `tools` input)"

inputs:
  tools:
    description: "Space-separated list of tools to install, e.g. 'trivy yamllint'"
    required: false
    default: "vault terraform kubectl trivy yamllint incus xorriso argocd atlasctl"

runs:
  using: composite
  steps:
    - name: Install required binaries
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        chmod +x tools/ci/install-tools.sh
        tools/ci/install-tools.sh $TOOLS
